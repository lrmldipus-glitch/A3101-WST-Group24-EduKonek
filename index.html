<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>MMDC || EduKonek</title>
</head>


<body>

    <main>
        <div class="login-box">
            <section>
                <div class="header-container">
                    <img src="https://media.mmdc.com.ph/MMDC%20Social%20Media%20Logo" alt="Mapua Malayan Digital College" class="logo">

                    <h1 class="header-title">
                        <span class="edu-text">|| Edu</span>Konek
                    </h1>
                </div>
            </section>
        
        <!-- Log in Page -->
            <section>
                <div class="input">
                    <p>Username: <input type="text" id="user-input" placeholder="Enter Username"></p>
                    <p>Password: <input type="password" id="pass-input" placeholder="Enter Password"></p>

                    <div class="button-grp">
                        <button type="submit" class="btn sign-in" onclick="checkCredentials()">Sign in</button>
                        <button type="button" class="btn sign-up" onclick="window.location.href = 'Signup.html'">Sign Up</button>
                    </div>
                </div>
            </section>
        </div>
    </main>
      <script src="index.js"></script>
</body>
</html>
