<body>
       <header>

            <img 
                src="https://media.mmdc.com.ph/MMDC%20Social%20Media%20Logo" 
                alt="MMDC Logo"
            >

            <h1>|| EduKonek</h1>

        <!-- Navbar -->
        <nav class="navbar">
            <a href="Dashboard.html" class="active">Dashboard</a>

                    <div class="user-icon">U</div>
                    User
                </div>

            </div>
        </nav>

<!-- Book a Session -->
        <section>
            <h2>Available Schedules</h2>
            <p>Book a new mentoring session with your instructors.</p>
            <form>
                <label for="select-course">Select Course:</label>
                <select id="select-course" name="course" required>
                    <option value="">--Select a course--</option>
                    <option value="prog1">Computer Programming</option>
                </select>

                <label for="select-instructor">Instructor:</label>
                <select id="select-instructor" name="instructor" required>
                    <option value="">--Select an instructor--</option>
                    <option value="inst1">Mr. Instructor</option>
                </select>

                <label for="select-date">Select Date:</label>
                <input type="date" id="select-date" name="date" required>

                <label for="select-time">Select Time:</label>
                <input type="time" id="select-time" name="time" required>

                <label for="summary-concern">Summary of Concern:</label>
                <textarea id="summary-concern" name="concern" rows="4" placeholder="Write a brief summary of your concern..."></textarea>

                <button type="submit">Confirm Booking</button>
            </form>
        </section>
</body> 
</html>
