<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MMDC || EduKonek</title>
</head>


<body>

    <header>
        <div class="header-section">

            <img 
                src="https://media.mmdc.com.ph/MMDC%20Social%20Media%20Logo" 
                alt="MMDC Logo"
            >

            <h1>|| EduKonek</h1>

        </div>
    </header>


    <main>

        <!-- login ssction -->
        <section class="login-section">

            <form id="loginForm">

                <label for="email">Email:</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email"
                    required
                >

                <label for="password">Password:</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    required
                >

                <button type="submit">Sign In</button>

            </form>

        </section>


        <!-- wlcome section -->
        <section class="lobby hidden">

            <h2>Welcome!</h2>

        </section>


        <!-- student dshboard -->
        <section class="student-dashboard hidden">

            <h2>Upcoming Mentoring Sessions</h2>

            <table>

                <thead>
                    <tr>
                        <th>Course</th>
                        <th>Date and Time</th>
                        <th>Instructor</th>
                    </tr>
                </thead>

                <tbody>

                    <tr>
                        <td>Placeholder</td>
                        <td>2026-10-15, 9:00 AM</td>
                        <td>Mr. Instructor</td>
                    </tr>

                    <tr>
                        <td>Placeholder</td>
                        <td>2026-10-15, 1:00 PM</td>
                        <td>Mr. Instructor</td>
                    </tr>

                    <tr>
                        <td>Placeholder</td>
                        <td>2026-10-15, 3:30 PM</td>
                        <td>Mr. Instructor</td>
                    </tr>

                </tbody>

            </table>


            <h2>Book a Mentoring Session</h2>

            <form>

                <label for="course">Select Course:</label>

                <select 
                    id="course" 
                    name="course" 
                    required
                >
                    <option value="">--Select a course--</option>

                    <option value="MO-IT104">
                        MO-IT104 - Computer Networks
                    </option>

                    <option value="MO-IT106">
                        MO-IT106 - Data Analytics Fundamentals
                    </option>

                    <option value="MO-IT161">
                        MO-IT161 - Web Systems and Technology
                    </option>

                </select>


                <label for="instructor">Instructor:</label>

                <select 
                    id="instructor" 
                    name="instructor" 
                    required
                >
                    <option value="">--Select an instructor--</option>

                    <option value="instructor1">
                        Mr. Instructor 1
                    </option>

                    <option value="instructor2">
                        Mr. Instructor 2
                    </option>

                    <option value="instructor3">
                        Mr. Instructor 3
                    </option>

                </select>


                <label for="date">Select Date:</label>

                <input 
                    type="date" 
                    id="date" 
                    name="date" 
                    required
                >


                <label for="time">Select Time:</label>

                <input 
                    type="time" 
                    id="time" 
                    name="time" 
                    required
                >


                <label for="concern">Summary of Concern:</label>

                <textarea 
                    id="concern" 
                    name="concern" 
                    rows="4"
                    placeholder="Write a brief summary of your concern..."
                ></textarea>


                <button type="submit">Submit</button>

            </form>

        </section>

    </main>

    <script>
        const loginForm = document.getElementById('loginForm');
        const hiddenSections = document.querySelectorAll('.hidden');

        loginForm.addEventListener('submit', function (event) {
            event.preventDefault();

            hiddenSections.forEach(section => {
                section.style.display = 'block';
            });

            document.querySelector('.login-section').style.display = 'none';
        });
    </script>

</body>
</html>
